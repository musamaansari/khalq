name: Verify Khalq
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: khalq_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: khalq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U khalq_test -d khalq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://khalq_test:local_ci_only@localhost:5432/khalq_test
      - run: npm run build
        env:
          APP_URL: https://khalq.io
      # Railway's GitHub integration deploys main after this workflow passes.
